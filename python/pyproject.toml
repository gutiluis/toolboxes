[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "technobool-toolbox"
version = "0.1.0"
description = "Small, reusable Python tools and utilities for scripting, automation, and development."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
maintainers = [
    { name = "Luis Gut" },
]
dependencies = [
    "Jinja2",
]

[project.urls]
Homepage = "https://github.com/gutiluis/toolboxes/tree/main/python"
Repository = "https://github.com/gutiluis/toolboxes"
Issues = "https://github.com/gutiluis/toolboxes/issues"

[tool.setuptools.packages.find]
where = ["src"]

