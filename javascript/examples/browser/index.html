<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Toolbox Browser Tests</title>
</head>
<body>

    <p id="pathname"></p>

            getPathname,

        document.querySelector("#url").textContent = getCurrentUrl();
        document.querySelector("#pathname").textContent = getPathname();
    </script>
</body>
